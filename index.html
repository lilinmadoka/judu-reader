/* Quiet section colors. Labels carry the meaning even when the colors look alike. */
.explain {
  --section-bg:var(--wash);
  --section-edge:var(--accent-line);
  --section-ink:#174941;
  background:var(--section-bg);
  border-inline-start:2px solid var(--section-edge);
  border-radius:0 7px 7px 0;
  box-shadow:0 1px 2px #3a32240d;
}
.explain[data-topic="usage"],.explain[data-topic="structure"] {
  --section-bg:var(--blue-wash);--section-edge:var(--blue-edge);--section-ink:var(--blue-ink);
}
.explain[data-topic="confusion"] {
  --section-bg:var(--amber-wash);--section-edge:var(--amber-edge);--section-ink:var(--amber-ink);
}
.explain[data-topic="morph"],.explain[data-topic="chunks"] {
  --section-bg:var(--violet-wash);--section-edge:var(--violet-edge);--section-ink:var(--violet-ink);
}
.inspector section.explain,.review-answer section.explain {
  margin:8px 0 0;
  padding:8px 10px;
  border-top:0;
}
.explain h3,.inspector .explain h3 {color:var(--section-ink);font-size:12px;margin:0 0 4px}
.explain p:last-child,.inspector .explain p:last-child {margin-bottom:0}
.inspector .explain .definition {color:var(--section-ink);margin:0;line-height:1.6}
.word,.picking .sentence {transition:background-color 115ms ease-out}
.tooltip {min-width:0;padding:5px 9px;font-size:12px;line-height:1.5}
.tooltip b {display:inline;font-size:14px;line-height:inherit;margin:0 7px 0 0}
.spell-pair {display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 4px;color:var(--amber-ink)}
.spell-pair b {font:700 15px/1.4 var(--serif);letter-spacing:.02em}
.spell-difference {background:#eed3ac;border-radius:2px;padding:0 1px}

[data-memory] {--memory-ink:var(--muted);--memory-wash:#eeebe5}
[data-memory="again"] {--memory-ink:var(--coral-ink);--memory-wash:var(--coral-tint)}
[data-memory="hinted"] {--memory-ink:var(--amber-ink);--memory-wash:var(--amber-tint)}
[data-memory="remembered"] {--memory-ink:var(--leaf-ink);--memory-wash:var(--leaf-tint)}
.memory-tag {
  display:inline-flex;align-items:center;gap:5px;
  color:var(--memory-ink);background:var(--memory-wash);
  padding:1px 7px;border-radius:5px;font:600 11px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
}
.memory-tag::before {content:"";width:11px;height:5px;border-bottom:1px dotted currentColor;flex:none}
.rating button[data-memory] {color:var(--memory-ink);background:var(--memory-wash)}
.rating button[data-memory]:hover {border-color:var(--memory-ink)}
.review-answer .rating {margin-top:12px}
.review-results li {align-items:center;flex-wrap:wrap}
.review-status-text {display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.review-jump {font-size:12px;color:var(--green);min-height:26px}
@media (prefers-reduced-motion:reduce) {
  .word,.picking .sentence,.tab,.plain,.primary,.ghost {transition:none}
}

/* Floating controls give the passage the full height of the window. */
:root {--settle:cubic-bezier(.22,1,.36,1);--float-inset:15px}
.workspace {height:100dvh}
.reader,.inspector {scroll-padding-bottom:74px}
.inspector {padding-bottom:74px}
.review {height:auto;min-height:100dvh;padding-bottom:90px}
.study-float {
  position:fixed;right:max(var(--float-inset),env(safe-area-inset-right));
  bottom:max(var(--float-inset),env(safe-area-inset-bottom));
  z-index:7;display:flex;gap:7px;align-items:center;max-width:calc(100vw - 20px);
}
.study-float nav,.study-clock {
  display:flex;gap:2px;align-items:center;padding:3px;
  background:#fefdfae8;border:1px solid var(--line);border-radius:12px;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:0 1px 2px #2a241a0f,0 6px 20px #2a241a14;
}
.study-float .tab {white-space:nowrap;border-radius:8px}
.review-float {
  position:fixed;right:var(--float-inset);bottom:calc(var(--float-inset) + 51px);z-index:7;
  border:1px solid var(--line);border-radius:11px;background:#fefdfae8;color:var(--green);
  padding:5px 10px;min-height:34px;backdrop-filter:blur(12px);box-shadow:0 1px 2px #2a241a0f,0 6px 20px #2a241a14;
}
.review-float:hover {background:var(--pale)}
.review-float .count {display:inline-block;min-width:1.25em;font-size:11px}
.anchor-float {bottom:calc(var(--float-inset) + 92px);display:flex;align-items:center;gap:4px;
  min-height:34px;padding-inline:8px;font-size:12px}
.anchor-float:disabled {opacity:.55}
.paper-meta-row {display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.progress-tag {color:var(--muted);font-size:11px;white-space:nowrap}
.progress-tag[data-progress="reading"] {color:var(--blue-ink)}
.progress-tag[data-progress="complete"],.progress-count {color:var(--green-deep);font-weight:700}
.paper-meta-row .progress-tag {padding:0 7px;border-radius:999px;background:#eeebe5;line-height:18px}
.paper-meta-row .progress-tag[data-progress="reading"] {background:var(--blue-tint)}
.paper-meta-row .progress-tag[data-progress="complete"] {background:var(--pale)}
.paper-sections .progress-tag {display:block;margin:0}
.paper-sections [data-open] {text-align:left}
.library-progress {font-size:13px;margin:5px 0 0}
.anchor-target {outline:2px solid var(--focus);outline-offset:3px}
.idle-dialog {width:min(360px,calc(100vw - 34px));border:1px solid var(--line);border-radius:15px;
  background:var(--paper);color:var(--ink);padding:21px 22px;box-shadow:0 18px 60px #1f1a1233}
.idle-dialog::backdrop {background:#1e1c19a8;backdrop-filter:blur(2px)}
.idle-dialog h2 {font-size:20px;margin:0 0 7px}
.idle-dialog p {margin-bottom:16px;color:var(--muted)}
.idle-dialog .dialog-actions {display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.library {min-height:100dvh;padding:clamp(22px,5vw,54px) 18px 100px}
.library-inner {width:min(760px,100%);margin:auto}
.library h1 {margin:0 0 3px;font-size:27px}
.library-head,.paper-item header {display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.library-actions {display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.paper-filter {width:100%;border:1px solid var(--line);border-radius:7px;background:var(--paper);padding:8px 11px;margin:12px 0 7px;color:var(--ink)}
.paper-filter:focus-visible {outline:2px solid var(--focus);outline-offset:2px}
.import-status {margin:0 0 10px;color:var(--green);font-size:13px;overflow-wrap:anywhere}
.import-status:empty {display:none}
.import-status[data-outcome="error"] {color:var(--coral-ink)}
.transfer-tools {margin-bottom:12px;font-size:13px;color:var(--muted)}
.transfer-tools summary {width:fit-content;cursor:pointer}
.transfer-tools .library-actions {margin-top:8px;justify-content:flex-start}
.prompt-dialog {width:min(660px,calc(100vw - 34px))}
.prompt-dialog textarea {display:block;width:100%;height:min(50vh,390px);margin-bottom:12px;padding:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:13px}
.update-panel {position:fixed;right:var(--float-inset,14px);top:var(--float-inset,14px);z-index:20;
  padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--paper);box-shadow:var(--shadow);font-size:13px}
.update-panel .ghost {margin-left:5px}
.library.drop-ready .paper-filter {outline:2px dashed var(--green);outline-offset:3px}
.paper-item {padding:14px 0;border-bottom:1px solid var(--line)}
.paper-item h2 {font-size:16px;margin:0}
.paper-item p {margin:6px 0 0}
.paper-sections {display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.paper-sections small {font-size:10px;margin-left:5px;color:var(--muted)}
.pdf-link {white-space:nowrap;font-size:12px}
.word-bank {display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:2px 14px;margin:9px 0 12px;font:16px/1.42 var(--serif)}
.choice-select {color:var(--ink);font:inherit;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:4px 7px}
.blank {display:inline-block;white-space:nowrap;padding:0 3px;border-bottom:1px solid #97918a;color:var(--green);font:600 12px system-ui;vertical-align:baseline}
.question-note {font-size:12px;margin:0 0 4px}
.questions {position:relative}
.questions > :not(.tape-layer) {position:relative}
.question .question-choice {display:grid;grid-template-columns:auto minmax(0,1fr);align-items:baseline;gap:7px;font:16px/1.45 var(--serif)}
.question .question-choice label {align-items:center}
.question-translation {color:var(--ink-soft);margin:4px 0 7px;font:13px/1.6 var(--sans)}
.question-translation summary {width:fit-content;cursor:pointer;color:var(--green)}
.question-translation p,.question-translation ul {margin:3px 0 4px}
.context-save {min-height:28px;text-decoration:underline;text-underline-offset:2px;font-size:12px;color:var(--green)}
.lookup-parts,.review-filters {display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.review-filters button[aria-pressed="true"] {border-color:var(--green);color:var(--green);background:var(--pale)}
.review-mask {margin:12px 0;min-height:50px;width:100%;text-align:left}
.toast {bottom:62px}
.study-clock {gap:6px;color:var(--ink-soft);padding:3px 5px 3px 9px;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.clock-dot {width:6px;height:6px;border-radius:50%;display:inline-block;background:var(--line-strong)}
.study-clock[data-clock="running"] .clock-dot {background:var(--leaf-line)}
.study-clock[data-clock="paused"] .clock-dot {background:var(--amber-line)}
.clock-time {min-width:36px;text-align:center}
.clock-toggle {padding:3px 7px;white-space:nowrap;font-size:11px}
.tooltip {
  --peek-nub:15px;z-index:10;transform-origin:var(--peek-nub) 0;
  max-width:min(330px,calc(100vw - 20px));
}
.tooltip::before {
  content:"";position:absolute;left:var(--peek-nub);top:-3px;
  width:7px;height:7px;background:inherit;transform:translateX(-50%) rotate(45deg);
}
.tooltip .peek-senses {display:inline;overflow-wrap:anywhere}
.tooltip .peek-sense {display:inline-block;max-width:100%;vertical-align:top}
.tooltip .peek-pos {font-size:10px;color:#b8dace;margin-right:3px}

<script>
"use strict";

// The marks are source positions. The review cards group those positions by meaning.
const saved = readLocal(readingStorage,{}) || {};
const marks = new Map(saved.marks || []);
const ratings = new Map(saved.ratings || []);
const dueDates = new Map(saved.dueDates || []);
const finished = new Set(saved.finished || []);
const choices = new Map(saved.choices || []);
const startedPassages = new Set([
  ...(saved.startedPassages || []),...finished,
  ...[...choices].filter(([,responses]) => Object.values(responses).some(Boolean)).map(([id]) => id),
  ...[...marks.values()].map((mark) => mark.materialId),
]);
const closeReadPassages = new Set(saved.closeReadPassages || []);
const progressLabels = {unread:"未开始",reading:"精读中",complete:"已精读"};
const passages = new Set();
const schedule = {
  again: { label: "没想起来", days: 1 },
  hinted: { label: "看提示才想起", days: 1 },
  remembered: { label: "直接想起", days: 3 },
};
function wordSpanKey(target) { return [target.materialId,target.sentence,target.start,target.end].join(":"); }
function markKey(target) { return wordSpanKey(target) + (target.contextual ? ":context:" + target.cardKey : ""); }
function groupCards(positions) {
  const cards = new Map();
  for (const target of positions) {
    const key = target.cardKey;
    if (!cards.has(key)) cards.set(key, { key, target, occurrences: [] });
    cards.get(key).occurrences.push(target);
    if (!cards.get(key).target.entry && target.entry) cards.get(key).target = target;
  }
  return [...cards.values()];
}
</script>
<script>
"use strict";
const sampleMaterial = JSON.parse(document.getElementById("material").textContent);
const dictionary = JSON.parse(document.getElementById("dictionary-data").textContent);
let catalogue = paperCatalogue(), material;
const get = (id) => document.getElementById(id);
const norm = (s) => s.toLowerCase().replace(/[’]/g, "'").trim().replace(/\s+/g, " ");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const wordPattern = /\p{L}+(?:[’'-]\p{L}+)*|\d+(?:\p{L}+)?/gu;
const blankPattern = /___(\d+)___/g;
const byWord = new Map(), byParagraph = new Map(), bySentence = new Map(), bySentencePosition = new Map();
let customDictionary = new Map();
let drawTapeLayer, drawQuestionTape;
let picking = null, activeLookup = null, completed = false;
let readingPointer = null, selectionGesture = false, skipPairedDoubleClick = false;
let reviewCard = null, hint = false, answer = false, toastTimer;
let reviewFilter = "all";
const postponed = new Set(), previouslyRetried = new Set();
const reviewedThisRound = new Set();
let manualReview = false;

function displaySentence(sentence) { return sentence.displayEn || sentence.en; }
function tokensFor(text) {
  const stripped = text.replace(blankPattern,(blank) => " ".repeat(blank.length));
  return [...stripped.matchAll(wordPattern)].map((m) => ({text:m[0],char:m.index}));
}
function renderText(text) {
  return esc(text).replace(blankPattern,'<span class="blank">($1)</span>');
}
function renderMaterial(id) {
  const next = getMaterial(id);
  if (!next) return false;
  material = next;
  customDictionary = importedDictionary(next);
  picking = null; activeLookup = null;
  readingPointer = null; selectionGesture = false; skipPairedDoubleClick = false;
  byWord.clear(); byParagraph.clear(); bySentence.clear(); bySentencePosition.clear();
  passages.clear();
  const knownExpressions = [...Object.keys(dictionary.phraseForms), ...customDictionary.keys()]
    .filter((form) => form.includes(" ")).map((form) => [form,undefined]);
  for (const sentence of material.sentences) {
    const display = displaySentence(sentence);
    const words = tokensFor(display);
    const item = {...sentence,display,words,context:sentence.phrases || [],phrases:[]};
    bySentence.set(sentence.id,item);
    if (!byParagraph.has(item.paragraph)) byParagraph.set(item.paragraph,[]);
    byParagraph.get(item.paragraph).push(item);
    const wordKeys = words.map((word) => norm(word.text));
    const context = item.context.map((phrase) => [phrase.text,{
      head:phrase.text,meaning:phrase.meaning,use:phrase.explanation,sense:phrase.sense,
    }]);
    for (const [form,entry] of [...Object.entries(material.phrases || {}),...context,...knownExpressions]) {
      const parts = norm(form).split(" ");
      for (let i = 0; i <= words.length - parts.length; i++) {
        if (parts.every((part,j) => part === wordKeys[i+j]) &&
            !display.slice(words[i].char,words[i+parts.length-1].char).includes("___") &&
            !item.phrases.some((p) => p.start === i && p.end === i + parts.length - 1)) {
          item.phrases.push({start:i,end:i+parts.length-1,entry});
        }
      }
    }
    item.phrases.sort((a,b) => (b.end-b.start)-(a.end-a.start));
  }
  const {label,title,first,last} = material.info;
  get("paper-meta").textContent = first ? material.exam + " · " + label + " · " + first + "–" + last : label;
  get("paper-title").textContent = material.englishTitle || (material.key === "reading" ? material.exam : title);
  get("go-questions").hidden = !material.questions.length;
  get("passage").innerHTML = '<div class="tape-layer" aria-hidden="true"></div>' +
    [...byParagraph].map(([number,sentences]) => renderParagraph(number,sentences)).join("");
  drawTapeLayer = createTapeLayer(get("passage").firstElementChild);
  renderQuestions();
  for (const el of get("reader").querySelectorAll("[data-token]")) bySentencePosition.set(el.dataset.token,el);
  renderArticleProgress();
  const source = get("source");
  source.textContent = material.sourceNote || "篇目来源　" + material.exam + " · " + label;
  if (material.verificationNotes.length) {
    const details = document.createElement("details");
    const summary = document.createElement("summary");
    summary.textContent = "待核对项（" + material.verificationNotes.length + "）";
    details.append(summary);
    for (const note of material.verificationNotes) {
      const line = document.createElement("div");
      line.textContent = note;
      details.append(line);
    }
    source.append(details);
  }
  get("inspect-kind").textContent = "";
  get("inspect-content").innerHTML = '<p class="muted">' + (material.sourceOnly ?
    "本篇已收录原题，逐句讲解待补。仍可查词和标记生词。" :
    "点正文中的单词查看常用义。想拆一句时，点段落右侧的「选句」。") + '</p>';
  get("inspector").scrollTop = 0;
  completed = finished.has(id);
  updateCompleted();
  markState();
  refreshTapes();
  get("reader").scrollTop = 0;
  return true;
}

function renderWordSentence(sentence) {
  let pos = 0;
  const pieces = [];
  sentence.words.forEach((word, index) => {
    const key = sentence.id + ":" + index;
    pieces.push(renderText(sentence.display.slice(pos, word.char)));
    pieces.push('<span class="word" data-token="' + key + '">' + esc(word.text) + '</span>');
    byWord.set(key,{sentence:sentence.id, index});
    pos = word.char + word.text.length;
  });
  return pieces.join("") + renderText(sentence.display.slice(pos));
}
function renderParagraph(number,sentences) {
  const label = sentences[0].paragraphLabel;
  const sectionName = label ? label + " 段" : "第 " + number + " 段";
  const hasTranslation = sentences.every((s) => s.literal || s.zh);
  const hasLiteral = hasTranslation && sentences.every((s) => s.literal);
  const translation = hasLiteral ? "直译" : "译文";
  return '<section class="paragraph" data-paragraph="' + number + '" aria-label="' + esc(sectionName) + '">' +
    '<div class="para-actions">' + (material.sourceOnly ? '' :
      '<button type="button" data-pick="' + number + '" aria-label="' + esc(sectionName) + '选句" aria-pressed="false">选句</button>') +
    (hasTranslation ? '<button type="button" data-translate="' + number + '" aria-label="展开' + esc(sectionName) + translation +
      '" aria-expanded="false" hidden>' + translation + '</button>' : '') + '</div>' +
    '<p class="english" lang="en">' + (label ? '<b>' + esc(label) + ') </b>' : '') +
    sentences.map((s) => '<span class="sentence" data-sentence="' + s.id + '">' + renderWordSentence(s) + '</span>').join(" ") + '</p>' +
    (hasTranslation ? '<div class="paragraph-translation" data-translated="' + number + '" hidden><span class="caption">' +
      (hasLiteral ? "段落直译" : "段落参考译文") + '</span><p>' + sentences.map((s) => esc(s.literal || s.zh)).join("") + '</p></div>' : '') +
    '</section>';
}
function renderQuestions() {
  const {first,last} = material.info;
  const bank = material.wordBank?.length ? '<div class="word-bank" lang="en">' + material.wordBank.map(({letter,word}) =>
    '<span>' + esc(letter) + ') ' + questionText("bank-" + letter,word) + '</span>').join("") + '</div>' : "";
  const answered = choices.get(material.id) || {};
  const heading = material.questions.length ? '<h2>Questions ' + first + '–' + last + '</h2>' : "";
  get("questions").innerHTML = '<div class="tape-layer" aria-hidden="true"></div>' + heading + bank + material.questions.map((q) => {
    const pick = answered[q.id];
    let options;
    if (material.key === "c1" || material.key === "c2") {
      options = q.options.map(([key,en]) => '<div class="question-choice"><label><input type="radio" data-question="' + q.id +
        '" name="q' + q.id + '" value="' + esc(key) + '" aria-label="' + esc(key + ") " + en) + '"' +
        (key === pick ? " checked" : "") + '> <span aria-hidden="true">' + esc(key) + ')</span></label>' +
        questionText("q-" + q.id + "-" + key,en) + '</div>').join("");
    } else {
      options = '<select class="choice-select" data-question="' + q.id + '" aria-label="第 ' + q.id + ' 题作答"><option value="">请选择</option>' +
        q.options.map(([key,en]) => '<option value="' + esc(key) + '"' + (key === pick ? " selected" : "") + '>' +
          esc(key) + (material.key === "a" ? ') ' + esc(en) : "") + '</option>').join("") + '</select>';
    }
    const translations = material.key === "c1" || material.key === "c2" ?
      q.options.filter(([, , zh]) => zh).map(([key, , zh]) => '<li>' + esc(key + ") " + zh) + '</li>').join("") : "";
    const translation = q.zh || translations ? '<details class="question-translation" lang="zh-CN">' +
      '<summary aria-label="第 ' + q.id + ' 题译文">题目译文</summary>' + (q.zh ? '<p>' + esc(q.zh) + '</p>' : "") +
      (translations ? '<ul>' + translations + '</ul>' : "") + '</details>' : "";
    return '<fieldset class="question" lang="en"><legend>' + q.id + '. ' + questionText("q-" + q.id,q.prompt) + '</legend>' +
      options + translation +
      '<div data-answer hidden><p class="reference" lang="zh-CN">' + (q.answer ? '参考答案 ' + esc(q.answer) : '未附参考答案') + '</p>' +
      (q.explanation ? '<p class="question-note" lang="zh-CN">' + esc(q.explanation) + '</p>' : '') + '</div></fieldset>';
  }).join("") + '<div class="finish"><button class="primary" id="finish-below">本篇做完</button>' +
    '<button class="ghost" type="button" id="close-read-toggle"></button>' +
    '<button class="plain" id="back-article">回到文章 ↑</button><p class="muted" id="finish-note"></p></div>';
  get("finish-below").onclick = finishPassage;
  drawQuestionTape = createTapeLayer(get("questions").firstElementChild);
  get("close-read-toggle").onclick = toggleCloseRead;

function lookupSelection() {
  const selection = window.getSelection();
  if (!selection || selection.isCollapsed || !selection.rangeCount) return;
  const range = selection.getRangeAt(0);
  const head = range.startContainer.parentElement?.closest(".sentence");
  const tail = range.endContainer.parentElement?.closest(".sentence");
  if (!head || head !== tail || !get("reader").contains(head)) return;
  const selected = norm(selection.toString());
  const length = [...selected.matchAll(wordPattern)].length;
  if (length < 2) return;
  const sentence = bySentence.get(head.dataset.sentence);
  for (let start = 0; start + length <= sentence.words.length; start++) {
    const end = start + length - 1;
    const first = bySentencePosition.get(sentence.id+":"+start);
    const last = bySentencePosition.get(sentence.id+":"+end);
    if (!range.intersectsNode(first) || !range.intersectsNode(last)) continue;
    const target = makeTarget(sentence,start,end);
    if (norm(target.text) !== selected) continue;
    if (hasOnlyWordGaps(target.text)) { showLookup(target,range); return; }
  }
  closePeek();
}

function drawMatchLines(animateWord) {

  get("study-clock").dataset.clock = phase === "running" && visible ? "running" : phase === "idle" ? "idle" : "paused";
  const label = {idle:"开始",paused:"继续",running:"暂停",confirm:"继续"}[phase];
  if (get("clock-toggle").textContent !== label) get("clock-toggle").textContent = label;
  if (phase === "confirm" && visible && !idleDialog.open) {
    closePeek();
    idleDialog.showModal();
  } else if (phase !== "confirm" && idleDialog.open) {
    idleDialog.close();
  }
}
function syncStudyClock() {
  renderClock(studyClock.update(Date.now(),!document.hidden));
}
function registerStudyActivity(event) {
  if (idleDialog.contains(event.target)) return;
  const studyArea = event.target.closest?.("#workspace,#review,#matching,#read-tab,#review-tab,#match-tab,#reading-anchor");
  const state = studyClock.activity(Date.now(),!document.hidden,event.type !== "scroll" && Boolean(studyArea));
  renderClock(state);
  if (state.phase === "confirm" && event.cancelable && (event.type === "click" || event.type === "keydown")) {
    event.preventDefault();
    event.stopImmediatePropagation();
  }
}
function setClockRunning(running) {
  renderClock(studyClock.setRunning(running,Date.now(),!document.hidden));
}
get("idle-continue").onclick = () => setClockRunning(true);
get("idle-rest").onclick = () => setClockRunning(false);
idleDialog.addEventListener("cancel",(event) => {
  event.preventDefault();
  setClockRunning(false);
});
get("clock-toggle").onclick = () => {
  const state = studyClock.update(Date.now(),!document.hidden);
  if (state.phase === "confirm") renderClock(state);
  else setClockRunning(state.phase !== "running");
};
for (const event of ["click","keydown"]) document.addEventListener(event,registerStudyActivity,{capture:true});
document.addEventListener("scroll",registerStudyActivity,{capture:true,passive:true});
for (const event of ["wheel","touchmove"]) {
  document.addEventListener(event,registerStudyActivity,{capture:true,passive:true});
  get("reader").addEventListener(event,() => startCurrentPassage(),{passive:true});
}
document.addEventListener("visibilitychange",() => {
  syncStudyClock();
  if (!document.hidden && material) {
    markState();
    if (currentPage === "review") renderReview();
  }
});
setInterval(syncStudyClock,300);
for (const page of Object.keys(pageIds)) {
  get(page+"-tab").onclick = () => showPage(page);
}
const library = get("library"), upload = get("paper-upload");
get("paper-filter").oninput = renderLibrary;
get("paper-list").onclick = (event) => {
  const open = event.target.closest("[data-open]");
  if (open) { openMaterial(open.dataset.open); return; }
  const related = event.target.closest("[data-related]");
  if (related) {
    get("paper-filter").value = catalogue.get(related.dataset.related).title;
    renderLibrary();
  }
};
get("import-button").onclick = () => upload.click();
get("copy-import-prompt").onclick = () => void copyImportPrompt();
get("export-backup").onclick = downloadBackup;
const backupUpload = get("backup-upload");
get("import-backup").onclick = () => backupUpload.click();
backupUpload.onchange = async () => {
  const file = backupUpload.files[0];
  backupUpload.value = "";
  if (!file) return;
  const button = get("import-backup");
  button.disabled = true;
  try {
    restoreReadingBackup(await readTransferFile(file,8 * 1024 * 1024));
    importStatus("已合并学习记录。本机已有的同一题作答和复习状态优先。");
  } catch (error) {
    importStatus(error.message,"error");
  } finally {
    button.disabled = false;
  }
};
upload.onchange = () => {
  if (!get("import-button").disabled) void importPaper(upload.files[0]);
  upload.value = "";
};
library.addEventListener("dragover",(event) => {
  if (!event.dataTransfer.types.includes("Files")) return;
  event.preventDefault();
  library.classList.add("drop-ready");
});
library.addEventListener("dragleave",(event) => {
  if (!library.contains(event.relatedTarget)) library.classList.remove("drop-ready");
});
library.addEventListener("drop",(event) => {
  event.preventDefault();
  library.classList.remove("drop-ready");
  if (get("import-button").disabled || !event.dataTransfer.files.length) return;
  if (event.dataTransfer.files.length === 1) void importPaper(event.dataTransfer.files[0]);
  else {
    get("import-status").textContent = "一次拖入一份试卷文件。";
    get("import-status").dataset.outcome = "error";
  }
});

const divider = get("divider");
if (typeof ResizeObserver === "function") new ResizeObserver(() => refreshTapes()).observe(get("passage"));
function setAside(width) {
  const w = get("workspace").clientWidth;
  const px = Math.max(240,Math.min(Math.min(520,Math.round(w*.54)),width));
  get("workspace").style.setProperty("--aside",px+"px");
  divider.setAttribute("aria-valuenow",String(px));
  divider.setAttribute("aria-valuetext","详解栏宽 "+px+" 像素");
}
divider.onpointerdown = (e) => { if(e.button===0) divider.setPointerCapture(e.pointerId); };
divider.onpointermove = (e) => {
  if (divider.hasPointerCapture(e.pointerId)) setAside(get("workspace").getBoundingClientRect().right-e.clientX-6);
};
divider.onkeydown = (e) => {
  if (!["ArrowLeft","ArrowRight"].includes(e.key)) return;
  e.preventDefault(); setAside(get("inspector").offsetWidth+(e.key==="ArrowLeft"?14:-14));
};
const restoreLastPassage = saved.last && !getMaterial(saved.last);
renderMaterial(saved.last || sampleId) || renderMaterial(sampleId);
refreshAnchorButton();
void loadStoredPapers().then(() => {
  catalogue = paperCatalogue();
  if (restoreLastPassage && currentPage === "read" && material.id === sampleId && getMaterial(saved.last)) {
    renderMaterial(saved.last);
  }
  if (currentPage === "library") renderLibrary();
  refreshAnchorButton();
}).catch(() => importStatus("暂时无法读取设备里的资料库。","error"));
</script>
<script src="install-web.js"></script>
</html>
